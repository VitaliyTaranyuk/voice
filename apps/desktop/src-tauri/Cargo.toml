[package]
name = "voice-desktop"
version = "0.1.0"
description = "Voice — AI voice input assistant for Windows"
authors = ["Voice"]
edition = "2021"

[lib]
name = "voice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
thiserror = "2"
