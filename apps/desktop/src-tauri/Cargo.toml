[package]
name = "voice-desktop"
version = "0.1.3"
description = "Voice — AI voice input assistant for Windows"
authors = ["Voice"]
edition = "2021"

[lib]
name = "voice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Проверка обновлений. Артефакты подписываются приватным ключом при сборке, а
# приложение проверяет подпись публичным из tauri.conf.json — иначе подмена
# манифеста позволила бы подсунуть пользователю чужой установщик.
tauri-plugin-updater = "2"
# Нужен для relaunch() после установки обновления.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
hound = "3.5"
arboard = "3"
enigo = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Windows Credential Manager: the user supplies API keys, so none ship in the installer.
# A crate rather than hand-rolled CredWriteW via `windows` — credential storage is not
# where to write bespoke unsafe FFI with manual CREDENTIALW layout and wide strings.
# The default `v1` feature already pulls in windows-native-keyring-store.
keyring = "4"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Registry",
] }
